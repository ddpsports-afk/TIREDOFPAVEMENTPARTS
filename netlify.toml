# The built website lives in /site. Netlify serves that folder as-is (no build step).
[build]
  publish = "site"

# Send people (and Google) who type /sitemap to the real sitemap file.
[[redirects]]
  from = "/sitemap"
  to = "/sitemap.xml"
  status = 301

# Old Framer page addresses: send them to the closest new page so old links and ads keep working.
[[redirects]]
  from = "/fast-cash"
  to = "/cash-today/"
  status = 301

# Basic security headers for every page. (A strict Content-Security-Policy is left out on
# purpose: it would need constant upkeep for Google Fonts and Netlify forms.)
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
